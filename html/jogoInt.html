<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expedição Histórica - Jogo de História do Brasil</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e5799, #207cca);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            min-height: 100vh;
        }
        
        h1 {
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 10px;
        }
        
        #game-container {
            position: relative;
            width: 900px;
            height: 600px;
            background: 
                linear-gradient(rgba(50, 150, 50, 0.2), rgba(50, 150, 50, 0.2)),
                url('https://images.unsplash.com/photo-1534447677768-be436bb09401?ixlib=rb-1.2.1&auto=format&fit=crop&w=900&h=600&q=80');
            background-size: cover;
            border: 5px solid #4a2c12;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }
        
        #player {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #ff3333;
            border-radius: 50%;
            transition: all 0.3s ease;
            z-index: 10;
            box-shadow: 0 0 10px #ff0000;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px black;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .checkpoint {
            position: absolute;
            width: 50px;
            height: 50px;
            background-color: rgba(255, 215, 0, 0.7);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #8b4513;
            font-weight: bold;
            font-size: 18px;
            z-index: 5;
            border: 3px solid #8b4513;
            box-shadow: 0 0 10px rgba(139, 69, 19, 0.7);
            transition: all 0.3s ease;
        }
        
        .checkpoint:hover {
            transform: scale(1.1);
        }
        
        #controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
        }
        
        .control-btn {
            padding: 12px 25px;
            font-size: 18px;
            background: linear-gradient(to bottom, #8b4513, #a0522d);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 #5d2e0f;
            transition: all 0.1s;
        }
        
        .control-btn:hover {
            background: linear-gradient(to bottom, #a0522d, #8b4513);
        }
        
        .control-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #5d2e0f;
        }
        
        #question-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        
        #question-box {
            background: linear-gradient(135deg, #f5f5dc, #f5deb3);
            padding: 30px;
            border-radius: 15px;
            width: 700px;
            max-width: 90%;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.7);
            border: 5px solid #8b4513;
        }
        
        #question-text {
            font-size: 22px;
            margin-bottom: 25px;
            color: #8b4513;
            font-weight: bold;
            text-align: center;
        }
        
        .answer-option {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: linear-gradient(to bottom, #8b4513, #a0522d);
            color: white;
            border: none;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }
        
        .answer-option:hover {
            background: linear-gradient(to bottom, #a0522d, #8b4513);
            transform: translateY(-2px);
        }
        
        #level-info {
            margin-top: 15px;
            font-size: 22px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        #feedback {
            margin-top: 15px;
            font-weight: bold;
            min-height: 30px;
            font-size: 18px;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
        }
        
        .correct {
            color: #7cfc00;
            background: rgba(0, 100, 0, 0.5);
        }
        
        .incorrect {
            color: #ff4500;
            background: rgba(100, 0, 0, 0.5);
        }
        
        #progress {
            margin-top: 15px;
            width: 300px;
            height: 20px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #8b4513, #daa520);
            transition: width 0.5s;
        }
        
        .checkpoint-icon {
            font-size: 24px;
            margin-right: 5px;
        }
        
        #player-name {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 12px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <h1>Expedição Histórica - Brasil</h1>
    <div id="level-info">Fase 1: Descobrimento do Brasil</div>
    <div id="progress">
        <div id="progress-bar"></div>
    </div>
    <div id="game-container">
        <div id="player">
            <div id="player-name">Explorador</div>
            🧭
        </div>
        <!-- Checkpoints serão posicionados dinamicamente -->
    </div>
    <div id="controls">
        <button class="control-btn" id="up-btn">↑</button>
        <button class="control-btn" id="left-btn">←</button>
        <button class="control-btn" id="down-btn">↓</button>
        <button class="control-btn" id="right-btn">→</button>
    </div>
    <div id="feedback"></div>
    
    <div id="question-modal">
        <div id="question-box">
            <div id="question-text"></div>
            <div id="answers-container"></div>
            <div id="modal-feedback"></div>
        </div>
    </div>
    
    <script>
        // Configuração do jogo
        const gameContainer = document.getElementById('game-container');
        const player = document.getElementById('player');
        const levelInfo = document.getElementById('level-info');
        const feedback = document.getElementById('feedback');
        const questionModal = document.getElementById('question-modal');
        const questionText = document.getElementById('question-text');
        const answersContainer = document.getElementById('answers-container');
        const modalFeedback = document.getElementById('modal-feedback');
        const progressBar = document.getElementById('progress-bar');
        
        // Posição inicial do jogador
        let playerX = 50;
        let playerY = 50;
        let currentLevel = 1;
        let questionsAnswered = 0;
        let totalQuestions = 0;
        let checkpoints = [];
        
        // Perguntas do jogo (História do Brasil)
        const questions = {
            1: {
                title: "Descobrimento do Brasil",
                checkpoints: [
                    { x: 200, y: 100 },
                    { x: 400, y: 300 },
                    { x: 700, y: 200 }
                ],
                questions: [
                    {
                        question: "Em que ano Pedro Álvares Cabral chegou ao Brasil?",
                        answers: ["1492", "1500", "1502", "1498"],
                        correct: 1,
                        fact: "Cabral chegou em 22 de abril de 1500, marcando o descobrimento oficial do Brasil."
                    },
                    {
                        question: "Qual o nome da frota portuguesa que chegou ao Brasil em 1500?",
                        answers: ["Frota do Pacífico", "Frota das Índias", "Frota do Brasil", "Frota do Cabo"],
                        correct: 1,
                        fact: "A Frota das Índias tinha como objetivo principal chegar às Índias, mas acabou desviando para o Brasil."
                    },
                    {
                        question: "Qual era o objetivo principal da expedição de Cabral?",
                        answers: ["Descobrir o Brasil", "Estabelecer uma colônia no Brasil", "Chegar às Índias", "Explorar a África"],
                        correct: 2,
                        fact: "Portugal buscava estabelecer rotas comerciais com as Índias, onde poderiam comprar especiarias."
                    }
                ]
            },
            2: {
                title: "Período Colonial",
                checkpoints: [
                    { x: 150, y: 400 },
                    { x: 450, y: 150 },
                    { x: 750, y: 350 }
                ],
                questions: [
                    {
                        question: "Quem foi o primeiro governador-geral do Brasil?",
                        answers: ["Tomé de Sousa", "Duarte da Costa", "Mem de Sá", "Martim Afonso de Sousa"],
                        correct: 0,
                        fact: "Tomé de Sousa foi nomeado em 1549 e fundou a cidade de Salvador, primeira capital do Brasil."
                    },
                    {
                        question: "Qual foi o principal produto econômico do Brasil no século XVI?",
                        answers: ["Ouro", "Café", "Açúcar", "Algodão"],
                        correct: 2,
                        fact: "O açúcar foi a base da economia colonial, cultivado em engenhos no Nordeste com mão de obra escrava."
                    },
                    {
                        question: "O que foram as Capitanias Hereditárias?",
                        answers: [
                            "Sistema de governo indígena",
                            "Divisão do território em lotes para nobres portugueses",
                            "Tipo de construção militar",
                            "Sistema religioso dos jesuítas"
                        ],
                        correct: 1,
                        fact: "As capitanias foram criadas em 1534 para colonizar o território, mas apenas Pernambuco e São Vicente prosperaram."
                    }
                ]
            },
            3: {
                title: "Inconfidência Mineira",
                checkpoints: [
                    { x: 100, y: 200 },
                    { x: 500, y: 100 },
                    { x: 800, y: 400 }
                ],
                questions: [
                    {
                        question: "Quando ocorreu a Inconfidência Mineira?",
                        answers: ["1789", "1822", "1750", "1808"],
                        correct: 0,
                        fact: "O movimento ocorreu em 1789, inspirado pelo Iluminismo e Independência dos EUA."
                    },
                    {
                        question: "Quem foi Tiradentes?",
                        answers: [
                            "Um pintor famoso",
                            "Líder da Inconfidência Mineira",
                            "Imperador do Brasil",
                            "Descobridor de Minas Gerais"
                        ],
                        correct: 1,
                        fact: "Joaquim José da Silva Xavier, o Tiradentes, foi o único conspirador executado, tornando-se mártir da independência."
                    },
                    {
                        question: "Qual era o principal motivo da Inconfidência Mineira?",
                        answers: [
                            "Abolição da escravidão",
                            "Independência de Portugal",
                            "Protesto contra os altos impostos",
                            "Liberdade religiosa"
                        ],
                        correct: 2,
                        fact: "O movimento surgiu principalmente contra a derrama, cobrança forçada de impostos sobre o ouro."
                    }
                ]
            },
            4: {
                title: "Independência do Brasil",
                checkpoints: [
                    { x: 300, y: 100 },
                    { x: 600, y: 300 },
                    { x: 200, y: 450 }
                ],
                questions: [
                    {
                        question: "Em que ano o Brasil declarou independência de Portugal?",
                        answers: ["1808", "1822", "1815", "1831"],
                        correct: 1,
                        fact: "D. Pedro I proclamou a independência em 7 de setembro de 1822 às margens do rio Ipiranga."
                    },
                    {
                        question: "Qual foi o papel de D. Leopoldina na independência?",
                        answers: [
                            "Nenhum, ela já havia falecido",
                            "Assinou o decreto de independência",
                            "Convenceu D. Pedro a permanecer no Brasil",
                            "Liderou tropas contra Portugal"
                        ],
                        correct: 2,
                        fact: "Leopoldina presidiu a reunião do Conselho de Estado que decidiu pela independência, enquanto D. Pedro estava em viagem."
                    },
                    {
                        question: "Qual país foi o primeiro a reconhecer a independência do Brasil?",
                        answers: ["Portugal", "Estados Unidos", "França", "Inglaterra"],
                        correct: 1,
                        fact: "Os EUA reconheceram em 1824, enquanto Portugal só aceitou em 1825 após pagamento de indenização."
                    }
                ]
            },
            5: {
                title: "República Velha",
                checkpoints: [
                    { x: 150, y: 150 },
                    { x: 450, y: 450 },
                    { x: 750, y: 250 }
                ],
                questions: [
                    {
                        question: "Quando foi proclamada a República no Brasil?",
                        answers: ["1888", "1889", "1891", "1894"],
                        correct: 1,
                        fact: "A República foi proclamada em 15 de novembro de 1889 por um golpe militar liderado por Deodoro da Fonseca."
                    },
                    {
                        question: "Qual foi a principal política econômica da República Velha?",
                        answers: [
                            "Café-com-Leite",
                            "Industrialização",
                            "Plano Real",
                            "Encilhamento"
                        ],
                        correct: 0,
                        fact: "A política Café-com-Leite alternava presidentes de São Paulo (café) e Minas Gerais (leite), as regiões mais ricas."
                    },
                    {
                        question: "O que foi a Revolta da Vacina?",
                        answers: [
                            "Protesto contra vacinação obrigatória",
                            "Movimento pela independência",
                            "Revolta de escravos",
                            "Guerra contra o Paraguai"
                        ],
                        correct: 0,
                        fact: "Ocorreu em 1904 no Rio de Janeiro contra a campanha de vacinação obrigatória contra varíola liderada por Oswaldo Cruz."
                    }
                ]
            },
            6: {
                title: "Era Vargas",
                checkpoints: [
                    { x: 250, y: 350 },
                    { x: 550, y: 200 },
                    { x: 750, y: 450 }
                ],
                questions: [
                    {
                        question: "Quantos anos durou o Estado Novo de Vargas?",
                        answers: ["5 anos", "8 anos", "10 anos", "15 anos"],
                        correct: 1,
                        fact: "O Estado Novo durou de 1937 a 1945, período ditatorial com censura e centralização de poder."
                    },
                    {
                        question: "Qual foi uma importante conquista trabalhista do governo Vargas?",
                        answers: [
                            "Abolição da escravidão",
                            "Criação da CLT",
                            "Reforma agrária",
                            "Voto feminino"
                        ],
                        correct: 1,
                        fact: "A CLT (Consolidação das Leis do Trabalho) foi criada em 1943, garantindo direitos como férias e 13º salário."
                    },
                    {
                        question: "Como terminou o governo Vargas em 1945?",
                        answers: [
                            "Eleições diretas",
                            "Golpe militar",
                            "Suicídio",
                            "Renúncia"
                        ],
                        correct: 1,
                        fact: "Vargas foi deposto por um golpe militar em outubro de 1945, encerrando o Estado Novo."
                    }
                ]
            }
        };
        
        // Inicializar o jogo
        function initGame() {
            totalQuestions = Object.keys(questions).length * 3;
            updatePlayerPosition();
            setupControls();
            createCheckpoints();
            updateLevelInfo();
            updateProgress();
        }
        
        // Atualizar a posição do jogador na tela
        function updatePlayerPosition() {
            player.style.left = `${playerX}px`;
            player.style.top = `${playerY}px`;
            
            // Animação ao mover
            player.style.animation = 'none';
            player.offsetHeight; // Trigger reflow
            player.style.animation = 'pulse 1.5s infinite';
        }
        
        // Configurar controles de movimento
        function setupControls() {
            const moveSpeed = 25;
            
            document.getElementById('up-btn').addEventListener('click', () => {
                playerY = Math.max(0, playerY - moveSpeed);
                updatePlayerPosition();
                checkCollisions();
            });
            
            document.getElementById('left-btn').addEventListener('click', () => {
                playerX = Math.max(0, playerX - moveSpeed);
                updatePlayerPosition();
                checkCollisions();
            });
            
            document.getElementById('down-btn').addEventListener('click', () => {
                playerY = Math.min(560, playerY + moveSpeed);
                updatePlayerPosition();
                checkCollisions();
            });
            
            document.getElementById('right-btn').addEventListener('click', () => {
                playerX = Math.min(860, playerX + moveSpeed);
                updatePlayerPosition();
                checkCollisions();
            });
            
            // Controles por teclado
            document.addEventListener('keydown', (e) => {
                switch(e.key) {
                    case 'ArrowUp':
                        playerY = Math.max(0, playerY - moveSpeed);
                        break;
                    case 'ArrowLeft':
                        playerX = Math.max(0, playerX - moveSpeed);
                        break;
                    case 'ArrowDown':
                        playerY = Math.min(560, playerY + moveSpeed);
                        break;
                    case 'ArrowRight':
                        playerX = Math.min(860, playerX + moveSpeed);
                        break;
                    default:
                        return;
                }
                updatePlayerPosition();
                checkCollisions();
            });
            
            // Clique no jogador (personagem)
            player.addEventListener('click', () => {
                player.style.transform = 'scale(1.2)';
                setTimeout(() => {
                    player.style.transform = 'scale(1)';
                }, 300);
                feedback.textContent = "Vamos explorar a história do Brasil!";
                feedback.className = "correct";
            });
        }
        
        // Criar checkpoints para o nível atual
        function createCheckpoints() {
            // Remove checkpoints antigos
            document.querySelectorAll('.checkpoint').forEach(cp => cp.remove());
            checkpoints = [];
            
            const levelData = questions[currentLevel];
            
            levelData.checkpoints.forEach((pos, index) => {
                const checkpoint = document.createElement('div');
                checkpoint.className = 'checkpoint';
                checkpoint.style.left = `${pos.x}px`;
                checkpoint.style.top = `${pos.y}px`;
                checkpoint.textContent = `${index + 1}`;
                checkpoint.dataset.index = index;
                checkpoint.dataset.reached = "false";
                
                gameContainer.appendChild(checkpoint);
                checkpoints.push(checkpoint);
            });
        }
        
        // Verificar colisões com checkpoints
        function checkCollisions() {
            checkpoints.forEach((checkpoint, index) => {
                if (checkpoint.dataset.reached === "false") {
                    const checkpointRect = checkpoint.getBoundingClientRect();
                    const playerRect = player.getBoundingClientRect();
                    
                    if (!(playerRect.right < checkpointRect.left || 
                          playerRect.left > checkpointRect.right || 
                          playerRect.bottom < checkpointRect.top || 
                          playerRect.top > checkpointRect.bottom)) {
                          
                        checkpoint.dataset.reached = "true";
                        checkpoint.style.backgroundColor = "rgba(0, 255, 0, 0.7)";
                        checkpoint.innerHTML = '✓<div class="checkpoint-icon">🎯</div>';
                        
                        // Animação ao alcançar checkpoint
                        checkpoint.style.transform = 'scale(1.2)';
                        setTimeout(() => {
                            checkpoint.style.transform = 'scale(1)';
                        }, 300);
                        
                        feedback.textContent = `Checkpoint ${index + 1} alcançado!`;
                        feedback.className = "correct";
                        
                        // Mostrar pergunta
                        setTimeout(() => showQuestion(currentLevel, index), 500);
                    }
                }
            });
        }
        
        // Mostrar pergunta
        function showQuestion(level, checkpointIndex) {
            const levelData = questions[level];
            const question = levelData.questions[checkpointIndex];
            
            questionText.textContent = question.question;
            answersContainer.innerHTML = '';
            
            question.answers.forEach((answer, i) => {
                const button = document.createElement('button');
                button.className = 'answer-option';
                button.textContent = answer;
                button.addEventListener('click', () => checkAnswer(i, question.correct, question.fact, checkpointIndex));
                answersContainer.appendChild(button);
            });
            
            modalFeedback.textContent = '';
            questionModal.style.display = 'flex';
        }
        
        // Verificar resposta
        function checkAnswer(selectedIndex, correctIndex, fact, checkpointIndex) {
            if (selectedIndex === correctIndex) {
                modalFeedback.innerHTML = `<div class="correct">✅ Resposta correta!</div><div style="margin-top:10px;font-style:italic;">${fact}</div>`;
                modalFeedback.className = "correct";
                questionsAnswered++;
                
                // Fechar o modal após 2 segundos
                setTimeout(() => {
                    questionModal.style.display = 'none';
                    updateProgress();
                    
                    if (checkpointIndex === 2) { // Última pergunta do nível
                        setTimeout(() => advanceLevel(), 1000);
                    }
                }, 2000);
            } else {
                modalFeedback.innerHTML = `<div class="incorrect">❌ Resposta incorreta!</div><div style="margin-top:10px;font-style:italic;">${fact}</div>`;
                modalFeedback.className = "incorrect";
                
                // Fechar o modal após 2 segundos
                setTimeout(() => {
                    questionModal.style.display = 'none';
                }, 2000);
            }
        }
        
        // Avançar de nível
        function advanceLevel() {
            if (currentLevel < Object.keys(questions).length) {
                currentLevel++;
                createCheckpoints();
                updateLevelInfo();
                
                // Mover jogador para posição inicial
                playerX = 50;
                playerY = 50;
                updatePlayerPosition();
                
                feedback.innerHTML = `🏆 Parabéns! Avançando para: <strong>${questions[currentLevel].title}</strong>`;
                feedback.className = "correct";
            } else {
                feedback.innerHTML = "🎉 <strong>Parabéns!</strong> Você completou todas as fases da história do Brasil!";
                feedback.className = "correct";
                
                // Animação de confete
                for (let i = 0; i < 100; i++) {
                    createConfetti();
                }
            }
        }
        
        // Criar efeito de confete
        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.innerHTML = ['🎉', '🎊', '🏆', '✨', '⭐'][Math.floor(Math.random() * 5)];
            confetti.style.position = 'absolute';
            confetti.style.left = Math.random() * window.innerWidth + 'px';
            confetti.style.top = -50 + 'px';
            confetti.style.fontSize = (Math.random() * 20 + 10) + 'px';
            confetti.style.animation = `fall ${Math.random() * 3 + 2}s linear forwards`;
            
            document.body.appendChild(confetti);
            
            setTimeout(() => {
                confetti.remove();
            }, 5000);
        }
        
        // Atualizar informações do nível
        function updateLevelInfo() {
            const levelData = questions[currentLevel];
            levelInfo.innerHTML = `Fase ${currentLevel}: <strong>${levelData.title}</strong>`;
        }
        
        // Atualizar barra de progresso
        function updateProgress() {
            const percent = Math.floor((questionsAnswered / totalQuestions) * 100);
            progressBar.style.width = `${percent}%`;
        }
        
        // Adicionar estilo para animação de confete
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes fall {
                to {
                    transform: translateY(${window.innerHeight + 100}px) rotate(360deg);
                }
            }
        `;
        document.head.appendChild(style);
        
        // Iniciar o jogo
        initGame();
    </script>
</body>
</html>
