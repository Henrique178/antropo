<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Matemática</title>

    <link rel="stylesheet" href="quiz.css">

    <style>
        
    </style>
</head>
<body>
    <div class="quiz-container">
        <h1>Quiz de Matemática</h1>
        
        <div class="progress">
            Pergunta <span id="current-question">1</span> de <span id="total-questions">5</span>
        </div>
        
        <div class="question" id="question"></div>
        
        <div class="options" id="options"></div>
        
        <div class="feedback" id="feedback"></div>
        
        <button class="btn" id="next-btn">Próxima Pergunta</button>
        
        <div class="score" id="score">
            Pontuação: 0/0
        </div>
    </div>

    <script>
        // VARIÁVEIS GLOBAIS
        let currentQuestionIndex = 0;
        let score = 0;
        let questions = [];

        // PERGUNTAS DO QUIZ (array de objetos)
        questions = [
            {
                question: "Quanto é 15 + 27?",
                options: ["32", "42", "52", "62"],
                correctAnswer: 1 // Índice da opção correta (começa em 0)
            },
            {
                question: "Qual é o resultado de 8 × 7?",
                options: ["48", "56", "64", "72"],
                correctAnswer: 1
            },
            {
                question: "Se um triângulo tem ângulos de 90°, 45° e 45°, ele é:",
                options: ["Equilátero", "Isósceles", "Escaleno", "Retângulo"],
                correctAnswer: 3
            },
            {
                question: "Qual é a raiz quadrada de 144?",
                options: ["10", "12", "14", "16"],
                correctAnswer: 1
            },
            {
                question: "Quantos lados tem um heptágono?",
                options: ["5", "6", "7", "8"],
                correctAnswer: 2
            }
        ];

        // ELEMENTOS DO DOM
        const questionElement = document.getElementById('question');
        const optionsElement = document.getElementById('options');
        const feedbackElement = document.getElementById('feedback');
        const nextButton = document.getElementById('next-btn');
        const scoreElement = document.getElementById('score');
        const currentQuestionElement = document.getElementById('current-question');
        const totalQuestionsElement = document.getElementById('total-questions');

        // INICIALIZAÇÃO
        totalQuestionsElement.textContent = questions.length;
        loadQuestion();

        // CARREGA UMA PERGUNTA
        function loadQuestion() {
            currentQuestionElement.textContent = currentQuestionIndex + 1;
            const currentQuestion = questions[currentQuestionIndex];
            questionElement.textContent = currentQuestion.question;
            
            optionsElement.innerHTML = '';
            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.textContent = option;
                button.className = 'option';
                button.addEventListener('click', () => selectOption(index));
                optionsElement.appendChild(button);
            });
            
            feedbackElement.textContent = '';
            feedbackElement.className = 'feedback';
            nextButton.style.display = 'none';
        }

        // SELECIONA UMA OPÇÃO
        function selectOption(selectedIndex) {
            const currentQuestion = questions[currentQuestionIndex];
            const options = document.querySelectorAll('.option');
            
            // Desabilita todas as opções após seleção
            options.forEach(option => {
                option.disabled = true;
            });
            
            // Verifica se a resposta está correta
            if (selectedIndex === currentQuestion.correctAnswer) {
                feedbackElement.textContent = "Correto! 🎉";
                feedbackElement.className = 'feedback correct';
                score++;
            } else {
                feedbackElement.textContent = `Incorreto! A resposta correta é: ${currentQuestion.options[currentQuestion.correctAnswer]}`;
                feedbackElement.className = 'feedback incorrect';
            }
            
            // Atualiza o placar
            scoreElement.textContent = `Pontuação: ${score}/${currentQuestionIndex + 1}`;
            nextButton.style.display = 'block';
        }

        // PRÓXIMA PERGUNTA
        nextButton.addEventListener('click', () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                // Fim do quiz
                questionElement.textContent = `Quiz concluído! Sua pontuação final: ${score}/${questions.length}`;
                optionsElement.innerHTML = '';
                feedbackElement.textContent = '';
                nextButton.style.display = 'none';
                
                // Mostra porcentagem de acertos
                const percentage = Math.round((score / questions.length) * 100);
                scoreElement.textContent = `Você acertou ${percentage}% das questões!`;
            }
        });
    </script>
</body>
</html>
